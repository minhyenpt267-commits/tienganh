let S={u:0,k:"listen",i:0,f:0,sp:.8,P:{}};
try{S.P=JSON.parse(localStorage.getItem("gs4")||"{}")}catch(e){}
function star(){const k=S.u+S.k;S.P[k]=(S.P[k]||0)+1;try{localStorage.setItem("gs4",JSON.stringify(S.P))}catch(e){}tabs()}
let V=null;function pv(){const v=speechSynthesis.getVoices();V=v.find(x=>/en-US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if("speechSynthesis" in window){pv();speechSynthesis.onvoiceschanged=pv}
function stop(){try{speechSynthesis.cancel()}catch(e){}}
function speak(t,r){stop();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r||S.sp;if(V)u.voice=V;speechSynthesis.speak(u)}
function spd(){$("sp").innerHTML="<b>Tốc độ:</b> "+[["🐢 Chậm",.6],["🚶 Vừa",.8],["🐇 Chuẩn",1]].map(x=>`<button class="${S.sp==x[1]?"on":""}" onclick="S.sp=${x[1]};spd();speak('Listen carefully.')">${x[0]}</button>`).join("")}
function tabs(){$("tb").innerHTML=[["listen","👂 Nghe"],["speak","🗣️ Nói"],["read","📖 Đọc"],["write","✍️ Viết"]].map(x=>`<button class="${S.k==x[0]?"on":""}" onclick="S.k='${x[0]}';S.i=0;stop();tabs();go()">${x[1]} ⭐${S.P[S.u+x[0]]||0}</button>`).join("")}
function go(){S.k=="listen"?rL():S.k=="write"?rW():rS()}
function done(){$("main").innerHTML=`<div class="card"><div class="txt">🏆 Hoàn thành!</div><p>Con đã hoàn thành phần này của ${esc(U[S.u].t)}. Giỏi lắm!</p><button class="pri" onclick="S.i=0;go()">Luyện lại</button> <button class="sec" onclick="if(S.u<U.length-1){S.u++;$('us').value=S.u}S.i=0;tabs();go()">Unit tiếp theo ➜</button></div>`}
const nx=()=>`<br><button class="pri" onclick="S.i++;go()">Câu tiếp ➜</button>`;
const tips=w=>w.map(x=>TIPS[x.toLowerCase()]?`<div class="tip"><b>${esc(x)}</b>: ${TIPS[x.toLowerCase()]}</div>`:"").join("");
// ----- listening
function rL(){const u=U[S.u],w=Math.random()<.4,src=w?u.w:pool(u),a=pick(src);S.a=a;S.o=sh([a,...sh(src.filter(x=>x!=a)).slice(0,2)]);
$("main").innerHTML=`<div class="card"><p class="ins">Nghe và chọn ${w?"từ":"câu"} đúng. Chọn sai thì nghe lại và chọn tiếp cho đến khi đúng.</p><button class="big" onclick="speak(S.a)">🔊 Nghe</button><div>${S.o.map((x,i)=>`<button class="opt" onclick="pk(${i})">${esc(x)}</button>`).join("")}</div><div id="fb"></div></div>`;setTimeout(()=>speak(a),250)}
function pk(i){const bs=document.querySelectorAll(".opt"),b=bs[i];
if(S.o[i]==S.a){b.classList.add("ok");bs.forEach(x=>x.disabled=1);$("fb").innerHTML=`<p class="g">🎉 Chính xác! Giỏi lắm.</p><button class="pri" onclick="rL()">Câu tiếp ➜</button>`;star()}
else{b.classList.add("bad");b.disabled=1;const r=evalOne(S.a,S.o[i]);$("fb").innerHTML=`<p class="r">Chưa đúng. Phần khác nhau nằm ở: <b>${esc(r.wrong.join(", ")||"thứ tự từ")}</b>. Con nghe lại thật kỹ rồi chọn lại nhé.</p>`;speak(S.a)}}
// ----- speaking & reading
function rS(){const u=U[S.u],sp=S.k=="speak",L=sp?u.qa:[...u.w.map(t=>[t]),...sents(u.rd).map(t=>[t])];
if(S.i>=L.length){done();return}
const it=L[S.i];S.T=sp?it[1]:[it[0]];S.q=it[0];S.f=0;
$("main").innerHTML=`<div class="card"><div class="mut">Câu ${S.i+1}/${L.length}</div><p class="ins">${sp?"Nghe câu hỏi rồi trả lời bằng cả câu hoàn chỉnh.":"Nghe mẫu rồi đọc to, rõ ràng."}</p><div class="txt">${EM[S.q.toLowerCase()]||""} ${esc(S.q)}</div><button class="big" onclick="speak(S.q)">🔊 Nghe ${sp?"câu hỏi":"mẫu"}</button> ${sp?`<button class="sec" onclick="$('fb').innerHTML='<p>Gợi ý câu trả lời: <b>'+esc(S.T.join(' / '))+'</b></p>'">💡 Gợi ý</button>`:""}<button class="mic" id="mic" onclick="mic()">🎤 Bấm để nói</button><div id="fb"></div></div>`;
if(sp)setTimeout(()=>speak(S.q),250)}
function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){$("fb").innerHTML=`<p class="r">Trình duyệt chưa hỗ trợ nhận giọng nói. Hãy mở bằng Chrome hoặc Edge.</p>`;return}
stop();const r=new SR(),b=$("mic");r.lang="en-US";r.maxAlternatives=3;r.interimResults=false;b.classList.add("rec");b.textContent="🔴 Đang nghe… hãy nói";let got=0;
r.onresult=e=>{got=1;show(best(S.T,[...e.results[0]].map(x=>x.transcript)))};
r.onerror=e=>{got=1;$("fb").innerHTML=`<p class="r">${e.error=="not-allowed"?"Cần cho phép trang web dùng micro.":"Chưa nghe thấy giọng con. Hãy nói to và rõ hơn nhé."}</p>`};
r.onend=()=>{b.classList.remove("rec");b.textContent="🎤 Bấm để nói";if(!got)$("fb").innerHTML=`<p class="r">Chưa nghe thấy giọng con. Hãy thử lại nhé.</p>`};
try{r.start()}catch(e){}}
function show(r){S.last=r.raw.join(" ");const ok=pass(r);
let h=`<div class="words">${r.raw.map((w,i)=>`<span class="${r.ok[i]?"g":"r u"}">${esc(w)}</span>`).join(" ")}</div><p>Con đã nói: <i>“${esc(r.heard)}”</i> · Chính xác: <b>${Math.round(r.acc*100)}%</b></p>`;
if(ok){h+=`<p class="g">🎉 Rất tốt! Con đọc đúng rồi.</p>`+nx();star()}
else{S.f++;h+=`<p class="r">Chưa đạt. ${r.wrong.length?`Từ cần sửa: <b>${esc(r.wrong.join(", "))}</b>.`:""} ${r.extra.length?`Từ thừa hoặc sai: <b>${esc(r.extra.join(", "))}</b>.`:""}</p>${tips(r.wrong)}<p>Con nghe mẫu, đọc theo thật chậm rồi bấm 🎤 nói lại (lần thử ${S.f}).</p><button class="sec" onclick="speak(S.last,.6)">🐢 Nghe mẫu chậm</button>`;if(S.f>=2)setTimeout(()=>speak(S.last,.6),400)}
$("fb").innerHTML=h}
// ----- writing
function rW(){const L=pool(U[S.u]);if(S.i>=L.length){done();return}
const s=L[S.i],bl=S.i%3==1;S.s=s;S.bl=bl;S.f=0;if(S.i%3==2&&s.split(/\s+/).length>=3){rO();return}if(bl)S.b=s.replace(/[.?!,]/g,"").split(" ").reduce((a,x)=>x.length>a.length?x:a);
$("main").innerHTML=`<div class="card"><div class="mut">Câu ${S.i+1}/${L.length}</div><p class="ins">${bl?"Nghe và điền từ còn thiếu.":"Nghe và viết lại cả câu (viết hoa chữ đầu câu, thêm dấu câu)."}</p>${bl?`<div class="txt">${esc(s.replace(S.b,"_____"))}</div>`:""}<button class="big" onclick="speak(S.s)">🔊 Nghe</button><input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key=='Enter')ck()"><button class="pri" onclick="ck()">Kiểm tra</button><div id="fb"></div></div>`;setTimeout(()=>speak(s),250)}
function ck(){const v=$("in").value.trim();if(!v)return;let h="",ok;
if(S.bl){const a=v.toLowerCase().replace(/’/g,"'"),b=S.b.toLowerCase().replace(/’/g,"'");ok=a==b;
if(!ok)h=`<p class="r">Chưa đúng. Kiểm tra chính tả từng chữ cái: ${[...b].map((c,i)=>`<b class="${a[i]==c?"g":"r"}">${a[i]==c?esc(c):"_"}</b>`).join(" ")} (từ có ${b.length} chữ cái). Nghe lại rồi viết lại nhé.</p>`}
else{const r=evalOne(S.s,v),nt=[];
if(S.s[0]!=S.s[0].toLowerCase()&&v[0]!=v[0].toUpperCase())nt.push("Chữ cái đầu câu phải viết hoa.");
const pe=S.s.slice(-1);if(/[.?!]/.test(pe)&&v.slice(-1)!=pe)nt.push(`Cuối câu cần dấu “${pe}”.`);
ok=r.acc==1&&!r.extra.length&&!nt.length;
if(!ok)h=`<div class="words">${r.raw.map((w,i)=>r.ok[i]?`<span class="g">${esc(w)}</span>`:`<span class="r">${"_".repeat(w.replace(/[.,?!]/g,"").length)}</span>`).join(" ")}</div><p class="r">Chưa đúng. ${r.wrong.length?`Con viết sai hoặc thiếu ${r.wrong.length} từ (các chỗ gạch dưới). `:""}${r.extra.length?`Có từ thừa: <b>${esc(r.extra.join(", "))}</b>. `:""}${nt.join(" ")}</p><p>Nghe lại thật chậm rồi sửa nhé.</p><button class="sec" onclick="speak(S.s,.6)">🐢 Nghe chậm</button>`}
if(ok){h=`<p class="g">🎉 Chính xác: <b>${esc(S.s)}</b></p>`+nx();star()}else S.f++;
$("fb").innerHTML=h}
function rO(){const w=S.s.split(/\s+/),id=w.map((x,i)=>i);let o;do{o=sh(id)}while(o.join()==id.join());S.W=w;S.bank=o;S.pl=[];S.f=0;drO()}
function drO(){const w=S.W,us=new Set(S.pl);$("main").innerHTML=`<div class="card"><div class="mut">Câu ${S.i+1}/${pool(U[S.u]).length}</div><p class="ins">Sắp xếp lại các từ thành câu đúng: chạm vào từng từ theo thứ tự. Chạm vào từ đã chọn để bỏ ra.</p><div class="slot">${S.pl.map(i=>`<button class="chip sel" onclick="rm(${i})">${esc(w[i])}</button>`).join("")||"<span class=mut>Câu của con sẽ hiện ở đây…</span>"}</div><div class="bank">${S.bank.map(i=>`<button class="chip" ${us.has(i)?"disabled":""} onclick="ad(${i})">${esc(w[i])}</button>`).join("")}</div><div class="row"><button onclick="speak(S.s)">🔊 Nghe gợi ý</button><button onclick="S.pl=[];drO()">↺ Làm lại</button></div><button class="pri" onclick="ckO()">Kiểm tra</button><div id="fb"></div></div>`}
function ad(i){S.pl.push(i);drO()}
function rm(i){S.pl=S.pl.filter(x=>x!=i);drO()}
function ckO(){const w=S.W;let h;if(S.pl.length<w.length){drO();$("fb").innerHTML=`<p class="r">Con chưa dùng hết các từ. Hãy chọn đủ ${w.length} từ nhé.</p>`;return}
const ok=S.pl.map((i,k)=>w[i].toLowerCase()==w[k].toLowerCase()),all=ok.every(x=>x);
const sp=`<div class="words">${S.pl.map((i,k)=>`<span class="${ok[k]?"g":"r u"}">${esc(w[i])}</span>`).join(" ")}</div>`;
if(all){h=sp+`<p class="g">🎉 Chính xác!</p>`+nx();star();speak(S.s)}
else{S.f++;h=sp+`<p class="r">Chưa đúng. Các từ ở vị trí số <b>${ok.map((x,k)=>x?"":k+1).filter(Boolean).join(", ")}</b> cần sắp xếp lại. Nhớ: chữ hoa đứng đầu câu, dấu câu đứng cuối câu.</p>`+(S.f>=2?`<p>Con nghe gợi ý rồi sắp xếp lại nhé.</p>`:"");if(S.f>=2)speak(S.s,.6)}
drO();$("fb").innerHTML=h}
$("us").innerHTML=U.map((u,i)=>`<option value="${i}">${u.t}</option>`).join("");
spd();tabs();go();
</script></body></html>
